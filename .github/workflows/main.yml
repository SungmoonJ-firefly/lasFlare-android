name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Gradle 빌드에 필요한 Java 17을 명시적으로 설정 및 활성화
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install "setuptools<76"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.37"

      - name: Set Pip Constraints for Sub-processes
        run: |
          cat > "$RUNNER_TEMP/pip-constraints.txt" <<'EOF'
          pip==24.3.1
          setuptools<76
          EOF
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pip-constraints.txt" >> "$GITHUB_ENV"

      - name: Create buildozer.spec
        run: |
          buildozer init

      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = lasFlare/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = lasflare/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.lasflare/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^# *android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^# *android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/^# *android.minapi = .*/android.minapi = 21/' buildozer.spec

      - name: Build APK
        run: |
          rm -rf .buildozer
          yes | buildozer -v android debug

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-error-log
          path: .buildozer/buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lasFlare-apk
          path: bin/*.apk
